[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handbook-qa"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "sentence-transformers",
    "qdrant-client",
    "groq",
    "pydantic",
    "pydantic-settings",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]